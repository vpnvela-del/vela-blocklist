name: Refresh blocklist

on:
  schedule:
    # 04:17 UTC daily. Off the hour on purpose -- abuse.ch asks that the dumps
    # not be fetched more often than every 5 minutes, and the top of the hour
    # is where every other scheduled job on GitHub piles up.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-blocklist
  cancel-in-progress: false

env:
  # Safety valve 1 -- absolute floor: anything under this is a broken fetch,
  # not a quiet day at abuse.ch. URLhaus alone gave 920-954 in late Oct 2026,
  # so even with every other source dead the list stays above it.
  MIN_DOMAINS: '500'
  # Safety valve 2 -- max shrink vs the last published list. Every source is
  # optional (one dead feed must not freeze the list again, as the URLhaus
  # 410 did 2026-10-22..27), so a source that dies quietly shows up as a
  # sudden drop instead. More than this and the run fails and the previous
  # list stays live. Normal day-to-day churn is a few percent.
  MAX_SHRINK_PCT: '40'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --------------------------------------------------------------------
      # Sources. All are abuse.ch v2 exports with the key in the URL PATH:
      #   https://<platform>-api.abuse.ch/v2/files/exports/<AUTH-KEY>/<file>
      # The legacy `Auth-Key:` header is ignored by the export endpoints, and
      # every anonymous /downloads/ and /export/ URL on urlhaus.abuse.ch and
      # threatfox.abuse.ch has returned 410 Gone since 2026-10-22. A bad key
      # gives 401 "Invalid auth token", a bad file name 404 "Invalid export
      # file name". Export whitelists (re-probe before changing anything --
      # abuse.ch changes them without notice):
      #   URLhaus   (2026-10-26): hostfile.txt recent.csv online.csv rpz.txt
      #                           online.json recent.json
      #   ThreatFox (2026-10-28): hostfile.txt recent.csv recent.json
      #                           full.csv.zip full.json.zip
      #
      #   URLhaus recent.csv    every URL added in the last 30 days (~214k rows,
      #                         mostly bare-IP botnet URLs the extractor drops)
      #   URLhaus hostfile.txt  hosts serving a payload now / added in the last
      #                         48h, Tranco-filtered; a small supplement
      #   ThreatFox hostfile    domain IOCs (C2, payload delivery) as a hosts
      #                         file; added 2026-10-28 so no single feed can
      #                         freeze the list again
      #
      # Each source is fetched and shape-checked on its own. A failure (HTTP
      # error, timeout, HTML/error body, zero usable domains) is logged and
      # that source is SKIPPED. The job only fails here if EVERY source fails.
      # --------------------------------------------------------------------
      - name: Fetch sources (each one optional)
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${ABUSECH_AUTH_KEY:-}" ]; then
            echo "::error::ABUSECH_AUTH_KEY is not set; every source needs it."
            exit 1
          fi
          mkdir -p feeds
          : > feeds/ok.tsv
          echo '### Sources' >> "$GITHUB_STEP_SUMMARY"

          # fetch <file> <label> <url>. The URL carries the key, so it is never
          # echoed (GitHub also masks the secret in logs).
          fetch() {
            local file="feeds/$1" label="$2" url="$3" code
            code=$(curl -sS -L --max-time 180 --retry 3 --retry-delay 5 \
                     -o "$file" -w '%{http_code}' "$url") || code="${code:-000}"
            echo "== $label: HTTP $code, $(wc -c < "$file" 2>/dev/null || echo 0) bytes"
            if [ "$code" = "200" ] && \
               python3 tools/build_blocklist.py --input "$file" \
                 --check-only --min-domains 1; then
              printf '%s\t%s\n' "$file" "$label" >> feeds/ok.tsv
              echo "- OK: $label" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$label failed (HTTP $code or no usable domains); skipping it."
              echo "- **SKIPPED**: $label (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
              rm -f "$file"
            fi
          }

          K="$ABUSECH_AUTH_KEY"
          fetch urlhaus-recent.csv     'URLhaus recent.csv'   "https://urlhaus-api.abuse.ch/v2/files/exports/$K/recent.csv"
          fetch urlhaus-hostfile.txt   'URLhaus hostfile'     "https://urlhaus-api.abuse.ch/v2/files/exports/$K/hostfile.txt"
          fetch threatfox-hostfile.txt 'ThreatFox hostfile'   "https://threatfox-api.abuse.ch/v2/files/exports/$K/hostfile.txt"

          if [ ! -s feeds/ok.tsv ]; then
            echo "::error::Every source failed; keeping the previous blocklist."
            exit 1
          fi
          echo "usable sources: $(wc -l < feeds/ok.tsv)"

      - name: Regenerate blocklist.txt
        run: |
          set -euo pipefail
          inputs=()
          labels=()
          while IFS=$'\t' read -r file label; do
            inputs+=(--input "$file")
            labels+=("$label")
          done < feeds/ok.tsv
          label="abuse.ch $(IFS=+; echo "${labels[*]}" | sed 's/+/ + /g') (malware)"
          # build_blocklist.py exits non-zero and writes NOTHING on an HTML/error
          # body, on fewer than MIN_DOMAINS, or on a drop of more than
          # MAX_SHRINK_PCT vs the current file -- the good list stays live.
          python3 tools/build_blocklist.py "${inputs[@]}" \
            --output blocklist.txt \
            --min-domains "$MIN_DOMAINS" \
            --max-shrink-pct "$MAX_SHRINK_PCT" \
            --source-label "$label"

      - name: Sanity-check the result
        run: |
          set -euo pipefail
          head -1 blocklist.txt
          count=$(grep -cv '^#' blocklist.txt)
          echo "domains in file: $count"
          echo "**domains: $count**" >> "$GITHUB_STEP_SUMMARY"
          [ "$count" -ge "$MIN_DOMAINS" ]
          # The NEVER_BLOCK guard must have held.
          for d in google.com github.com dropbox.com drive.google.com sites.google.com \
                   docs.google.com raw.githubusercontent.com workers.dev vercel.app \
                   dl.google.com snippet.host; do
            if grep -qx "$d" blocklist.txt; then
              echo "::error::$d is on the list -- the NEVER_BLOCK guard failed"
              exit 1
            fi
          done
          echo "NEVER_BLOCK guard: OK"

      - name: Upload the built list (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: blocklist
          path: blocklist.txt
          retention-days: 7

      # Only main publishes. A dispatch on any other branch is a dry run.
      - name: Commit if materially changed
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # build_blocklist.py leaves the file untouched when the domain set is
          # identical, so an unchanged domain set produces no diff at all -- the
          # header date is not rewritten just to churn a commit.
          if git diff --quiet -- blocklist.txt; then
            echo "No material change; nothing to commit."
            exit 0
          fi
          git config user.name  'vela-blocklist-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blocklist.txt
          git commit -m "Refresh blocklist: $(grep -cv '^#' blocklist.txt) domains" \
                     -m "$(head -1 blocklist.txt)"
          # Retry the push. Run #11 (2026-09-13) built a good list but lost it to
          # `! [remote rejected] main -> main (failure)` -- a GitHub-side error
          # during an incident (authorization-endpoint errors), not a repo rule
          # or permission problem. Rebasing first also covers a commit landing
          # on main while the job ran. The list is only ever published here, so
          # a failed attempt leaves the previous good blocklist.txt live.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            [ "$attempt" -eq 5 ] && break
            delay=$((30 * 2 ** (attempt - 1)))
            echo "::warning::push attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
            fi
          done
          echo "::error::git push failed after 5 attempts"
          exit 1
