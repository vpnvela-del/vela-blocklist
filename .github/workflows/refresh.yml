name: Refresh blocklist

on:
  schedule:
    # 04:17 UTC daily. Off the hour on purpose -- abuse.ch asks that the dumps
    # not be fetched more often than every 5 minutes, and the top of the hour
    # is where every other scheduled job on GitHub piles up.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-blocklist
  cancel-in-progress: false

env:
  # Safety valve. The verified seed is 4,911 domains; anything under this is a
  # broken fetch, not a quiet day at abuse.ch.
  MIN_DOMAINS: '1000'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --------------------------------------------------------------------
      # Source 1 (authenticated): the URLhaus hostfile.
      #
      # abuse.ch moved authenticated downloads to the v2 API and the key now
      # travels in the URL PATH:
      #   https://urlhaus-api.abuse.ch/v2/files/exports/<AUTH-KEY>/hostfile.txt
      # The legacy `Auth-Key:` request header is accepted but ignored -- the old
      # https://urlhaus.abuse.ch/downloads/hostfile/ endpoint returns the same
      # anonymous body with the header, without it, and with a bogus key
      # (verified 2026-09-05). We still send the header for forward
      # compatibility; the path is what actually authenticates.
      #
      # The hostfile is small on purpose: it covers only hostnames that are
      # currently serving a payload or were added in the last 48 hours, already
      # filtered against the Tranco Top 1M. That was ~386 domains on
      # 2026-09-05, so it is a *supplement*, never the whole list.
      # --------------------------------------------------------------------
      - name: Fetch the authenticated URLhaus hostfile
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${ABUSECH_AUTH_KEY:-}" ]; then
            echo "::warning::ABUSECH_AUTH_KEY is not set; using the public plain-text URL feed alone."
            exit 0
          fi
          url="https://urlhaus-api.abuse.ch/v2/files/exports/${ABUSECH_AUTH_KEY}/hostfile.txt"
          code=$(curl -sS -L --max-time 120 --retry 3 --retry-delay 5 \
                   -H "Auth-Key: ${ABUSECH_AUTH_KEY}" \
                   -o feed_auth.txt -w '%{http_code}' "$url")
          echo "HTTP $code, $(wc -c < feed_auth.txt 2>/dev/null || echo 0) bytes"
          # Does it parse at all? --min-domains 1 keeps this a shape check; the
          # real floor is applied to the merged result below.
          if [ "$code" != "200" ] || \
             ! python3 tools/build_blocklist.py --input feed_auth.txt \
                 --check-only --min-domains 1; then
            echo "::warning::Authenticated hostfile fetch failed or returned no usable domains; continuing with the public feed alone."
            rm -f feed_auth.txt
          fi

      # --------------------------------------------------------------------
      # Source 2 (public, no auth): the plain-text URL list -- active malware
      # URLs plus everything added in the last 90 days. This is the feed the
      # verified 4,911-domain seed was built from and it carries the bulk of
      # the coverage.
      # --------------------------------------------------------------------
      - name: Fetch the public URLhaus plain-text URL feed
        run: |
          set -euo pipefail
          code=$(curl -sS -L --max-time 180 --retry 3 --retry-delay 5 \
                   -o feed_public.txt -w '%{http_code}' \
                   'https://urlhaus.abuse.ch/downloads/text/')
          echo "HTTP $code, $(wc -c < feed_public.txt) bytes"
          if [ "$code" != "200" ]; then
            echo "::error::Public feed returned HTTP $code"
            exit 1
          fi

      - name: Regenerate blocklist.txt
        run: |
          set -euo pipefail
          inputs=(--input feed_public.txt)
          label='abuse.ch URLhaus (plain-text URL feed, malware only)'
          if [ -f feed_auth.txt ]; then
            inputs+=(--input feed_auth.txt)
            label='abuse.ch URLhaus (plain-text URL feed + authenticated hostfile, malware only)'
          fi
          # Hard safety valve: build_blocklist.py exits non-zero (failing the
          # run) on an HTML/error body or on fewer than MIN_DOMAINS domains, and
          # writes nothing in that case -- the good list stays untouched.
          python3 tools/build_blocklist.py "${inputs[@]}" \
            --output blocklist.txt \
            --min-domains "$MIN_DOMAINS" \
            --source-label "$label"

      - name: Sanity-check the result
        run: |
          set -euo pipefail
          head -1 blocklist.txt
          count=$(grep -cv '^#' blocklist.txt)
          echo "domains in file: $count"
          [ "$count" -ge "$MIN_DOMAINS" ]
          # The NEVER_BLOCK guard must have held.
          for d in google.com github.com dropbox.com drive.google.com sites.google.com; do
            if grep -qx "$d" blocklist.txt; then
              echo "::error::$d is on the list -- the NEVER_BLOCK guard failed"
              exit 1
            fi
          done
          echo "NEVER_BLOCK guard: OK"

      - name: Commit if materially changed
        run: |
          set -euo pipefail
          # build_blocklist.py leaves the file untouched when the domain set is
          # identical, so an unchanged domain set produces no diff at all -- the
          # header date is not rewritten just to churn a commit.
          if git diff --quiet -- blocklist.txt; then
            echo "No material change; nothing to commit."
            exit 0
          fi
          git config user.name  'vela-blocklist-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blocklist.txt
          git commit -m "Refresh blocklist: $(grep -cv '^#' blocklist.txt) domains" \
                     -m "$(head -1 blocklist.txt)"
          git push
